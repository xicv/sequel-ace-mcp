name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.job }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full gate set on macOS — the platform every step of this
          # workflow was verified on locally (scripts/ci-local.sh):
          # fmt, clippy -D warnings, workspace tests.
          - os: macos-14
            job: test
          # Cross-platform compile proof only: the crate has macOS-only
          # dependencies (Keychain, Touch ID), so Linux asserts that the
          # tree at least checks cleanly there.
          - os: ubuntu-24.04
            job: check
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-23
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check (all targets)
        run: cargo check --workspace --all-targets --locked

      - name: Test
        if: matrix.job == 'test'
        run: cargo test --workspace --locked

  secret-scan:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run repo secret scan
        run: bash scripts/check-secrets.sh

      - name: Run gitleaks (history scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source=. --no-git=false --redact -v
        continue-on-error: false
