# cargo-deny configuration for sequel-mcp.
#
# License allowlist: this project is MIT; dependencies under MIT,
# Apache-2.0, and the common permissive/Unicode-family licenses are fine.
# Anything copyleft (GPL/AGPL/SSPL) is rejected.

[advisories]
version = 2
# ttf-parser (via egui's ab_glyph) is flagged unmaintained with no safe
# upgrade available today. Tracked for the GUI phase; not a vulnerability.
yanked = "deny"
ignore = [
    "RUSTSEC-2026-0192", # unmaintained: ttf-parser via egui/ab_glyph; alternative skrifa not yet adopted by egui
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",   # (from dual-licensed crates, inert linking)
    "CC0-1.0",
    "BSL-1.0",   # Boost Software License (rustc-demangle and friends)
    "CDLA-Permissive-2.0", # data license on cached datasets (spelled out, permissive)
]

[[licenses.exceptions]]
# egui's embedded default fonts ship under a conjunctive font license.
allow = ["MIT", "Apache-2.0", "OFL-1.1", "Ubuntu-font-1.0"]
name = "epaint_default_fonts"
version = "*"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
